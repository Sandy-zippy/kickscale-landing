<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Console — ZippyScale</title>
<link rel="icon" href="img/zippyscale-logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* Set before anything paints. Reading this from app.js would work, but app.js
   loads at the end of the body, so the page would flash the wrong theme first
   and settle afterwards — which looks broken rather than themed. */
(function () {
  try {
    var saved = localStorage.getItem('zs_theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    /* no choice made yet means follow the machine */
    document.documentElement.setAttribute('data-theme',
      saved === 'light' || saved === 'dark' ? saved : (dark ? 'dark' : 'light'));
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<style>
/* ---- tokens: ZippyScale on dark grey ----
   Grey surfaces, not black, so cards can sit above the page without a border
   doing all the work. Lime is the accent and nothing else is: one colour means
   one thing. Status colours always ship beside a word or an arrow — amber and
   green separate by only ΔE 7.4 under protanopia, so colour alone would not be
   readable for everyone. ---- */
/* ---- two themes, one set of names ----

   Everything on this page reads a token, so a theme is a palette rather than a
   second stylesheet. Two rules make that possible and are worth stating:

   1. THE BRAND LIME IS A FILL, NEVER INK. #D9EA66 on white is 1.3:1 — not
      "low contrast", invisible. So --ember is what you paint WITH and --accent
      is what you write IN, and they are only the same colour in the dark. The
      same mistake was live on four components: white text on a lime pill.
   2. THE STATUS COLOURS ARE TUNED FOR A DARK BACKGROUND. A #6FCF8E green that
      reads well on charcoal is 1.9:1 on white, so each has an ink variant that
      the light theme darkens while the fill stays as it is.
*/
:root{
  --ink:#121316;              /* page */
  --coal:#191B1F;             /* rail, top bar */
  --char:#1E2126;             /* card */
  --char2:#252930;            /* raised / hover */
  --line:#2C3138;
  --line2:#373D46;
  --paper:#FFFFFF;            /* things that invert: toast, tooltip */
  --paper-ink:#121212;
  --mist:#F5F5F4;
  --hair:#E4E4E2;
  --lime:#D9EA66;
  --lime-dim:#A9B84F;
  --lime-ink:#141610;         /* text ON lime, in either theme */
  --lime-wash:rgba(217,234,102,.12);
  --ember:#D9EA66;            /* accent as a FILL */
  --ember-dk:#A9B84F;
  --accent:#D9EA66;           /* accent as INK — diverges in light */
  --tx:#FFFFFF;
  --tx2:#D9D5D2;
  --mut:#A8ADB4;
  --dim:#767C85;
  --ok:#6FCF8E;   --ok-ink:#6FCF8E;
  --warn:#E9B949; --warn-ink:#E9B949;
  --bad:#F2664F;  --bad-ink:#F2664F;
  --info:#7FB3E8; --info-ink:#7FB3E8;
  --on-bad:#150604;           /* text ON the red */
  --note-bg:#1E1A0A;          /* the internal-use banner */
  --note-ink:#E8DFA8;
  --note-line:#3A3418;
  --wa-bg:#10150E;            /* the WhatsApp message preview */
  --shadow:var(--shadow);
  --glow:0 0 0 1px rgba(217,234,102,.25);
  --d:'Archivo',system-ui,sans-serif;
  --b:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --rail:246px;
  --rail-shut:64px;
  --pad:clamp(16px,2vw,28px);
  --r:12px;
}

/* The light theme. Not an inversion: the greys are warm rather than the cold
   mirror of the dark ones, the accent becomes an olive that can be read, and
   every status colour is darkened until it holds its own against white. */
:root[data-theme="light"]{
  --ink:#F7F7F5;              /* page */
  --coal:#FFFFFF;             /* rail, top bar */
  --char:#FFFFFF;             /* card */
  --char2:#F1F1EE;            /* raised / hover */
  --line:#E3E3DE;
  --line2:#CFCFC8;
  --paper:#1E2126;            /* inverts, so the toast still stands out */
  --paper-ink:#FFFFFF;
  --lime-wash:rgba(217,234,102,.30);
  --ember:#D9EA66;            /* the brand fill is the brand fill */
  --ember-dk:#C3D44F;
  --accent:#5A6B14;           /* ...but written down, it has to be legible */
  --tx:#16181C;
  --tx2:#3A3D42;
  --mut:#5C6169;
  --dim:#82868D;
  --ok:#6FCF8E;   --ok-ink:#1E7A45;
  --warn:#E9B949; --warn-ink:#8A6206;
  /* the coral is a dark-background red: white on it is 3.1:1, which fails, so
     on light it darkens until the text on it can actually be read */
  --bad:#C93A22;  --bad-ink:#B3341C;
  --info:#7FB3E8; --info-ink:#1C5C99;
  --on-bad:#FFFFFF;
  --note-bg:#FBF6D9;
  --note-ink:#4A4310;
  --note-line:#E7DFA8;
  --wa-bg:#F2F5EA;
  --shadow:rgba(20,22,16,.14);
  --glow:0 0 0 1px rgba(90,107,20,.22);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--tx);
  font-family:var(--b);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--d);margin:0;line-height:1.12;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
[hidden]{display:none!important}

/* ================= the shell =================
   A left rail because this is a console somebody lives in, not a site they
   visit: destinations stay in one place, the current one is always visible,
   and collapsing gives the boards their width back on a laptop. */
body{display:block}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:60;
  background:var(--coal);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:width .18s ease}
.railshut .rail{width:var(--rail-shut)}
.railhead{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line);min-height:62px}
.railhead img{width:auto;flex:none}
/* the real wordmark when the rail is open, the mark alone when it is shut —
   never a CSS imitation of either */
.railhead .logo-full{height:22px}
.railhead .logo-mark{height:26px;display:none}
.railshut .railhead .logo-full{display:none}
.railshut .railhead .logo-mark{display:block}
.railshut .railhead{justify-content:center;padding:16px 0}

.nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;height:40px;padding:0 11px;border-radius:7px;
  color:var(--mut);font-family:var(--b);font-size:13.5px;font-weight:500;white-space:nowrap;
  position:relative;transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--char);color:var(--tx)}
.nav a.on{background:var(--lime-wash);color:var(--tx)}
.nav a.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;
  border-radius:0 3px 3px 0;background:var(--lime)}
.nav a i{margin-left:auto;font-style:normal;background:var(--lime);color:var(--lime-ink);
  font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;font-family:var(--b)}
.railshut .nav a span{display:none}
.railshut .nav a{justify-content:center;padding:0}
.railshut .nav a i{position:absolute;top:4px;right:6px;margin:0;padding:0 4px}

.railfoot{border-top:1px solid var(--line);padding:9px 8px;display:flex;flex-direction:column;gap:6px}
.railbtn{display:flex;align-items:center;gap:11px;height:36px;padding:0 11px;border-radius:7px;
  background:none;border:0;color:var(--mut);font-family:var(--b);font-size:12.5px;cursor:pointer;
  width:100%;text-align:left}
.railbtn:hover{background:var(--char);color:var(--tx)}
.railbtn svg{width:17px;height:17px;flex:none}
.railshut .railbtn span{display:none}
/* the button shows where you are GOING, not where you are */
:root[data-theme="dark"] .ico-light{display:none}
:root[data-theme="light"] .ico-dark{display:none}
.railshut .railbtn{justify-content:center;padding:0}

.shellmain{margin-left:var(--rail);transition:margin .18s ease;min-height:100vh;display:flex;flex-direction:column}
.railshut .shellmain{margin-left:var(--rail-shut)}

.topbar{position:sticky;top:0;z-index:50;background:rgba(25,27,31,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:0 var(--pad);min-height:62px}
.topbar .where{font-family:var(--d);font-weight:600;font-size:15px;letter-spacing:-.01em}
.topbar .spacer{flex:1}

@media(max-width:860px){
  .rail{width:var(--rail-shut)}
  .rail .nav a span,.railhead .wm,.railbtn span{display:none}
  .rail .nav a,.railbtn{justify-content:center;padding:0}
  .shellmain{margin-left:var(--rail-shut)}
}

/* ================= Jarvis ================= */
.agico{width:30px;height:30px;border-radius:9px;background:var(--lime-wash);color:var(--lime);
  display:grid;place-items:center;font-size:14px;flex:none}
.chatlog{max-height:52vh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.chatempty{text-align:center;padding:40px 20px;color:var(--dim)}
.chatempty b{display:block;font-size:30px;color:var(--lime);margin-bottom:10px}
.chatempty p{max-width:420px;margin:0 auto;font-size:13px}
.chatturn{display:flex;flex-direction:column;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .av{width:28px;height:28px;border-radius:50%;background:var(--char2);color:var(--mut);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.bubble .av.jv{background:var(--lime-wash);color:var(--lime)}
.bubble p{margin:0;font-size:13px;line-height:1.55}
.bubble.you p{background:var(--char2);border-radius:10px;padding:9px 12px;color:var(--tx)}
.bubble.him .said{flex:1;min-width:0}
.matched{display:block;margin-top:7px;font-size:10.5px;color:var(--dim);font-style:italic}
.chatacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.chatbar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--coal);flex-wrap:wrap}
.chatbar input{flex:1;min-width:140px}
.chatbar .micbtn{flex-shrink:0}
@media (max-width:560px){.chatbar input{flex:1 0 100%}}
.prop{padding:15px 16px;margin-bottom:12px}
.prophead{display:flex;gap:11px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.prophead .t{flex:1;min-width:0}
.prophead .t b{display:block;font-size:13.5px}
.prophead .t span{font-size:11px;color:var(--dim)}
.why{margin-top:10px}
.why summary{cursor:pointer;font-size:12px;color:var(--mut)}
.why summary:hover{color:var(--tx)}
.why .ledger{margin-top:9px}
.draft{margin-top:12px}
.draft label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
.draft textarea{width:100%}
.propacts{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.honest{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.55;max-width:70ch}

.btn.danger{background:none;border-color:var(--bad);color:var(--bad-ink)}
.btn.danger:hover{background:var(--bad);color:var(--on-bad)}
.inlinef{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.inlinef label{font-size:12.5px;color:var(--mut)}
.mtrow{padding:11px 14px;border-bottom:1px solid var(--line)}
.mtrow:last-child{border-bottom:0}
.mtrow.soon{box-shadow:inset 2px 0 0 0 var(--warn)}
.mthead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.mthead b{font-size:12.5px}
.mthead span{font-size:11.5px;color:var(--dim)}
.mtmin{margin:7px 0 0;font-size:12.5px;color:var(--tx);line-height:1.5;white-space:pre-wrap}
/* a filed document: open / edit / remove, always all three */
.dfile .dacts{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.dfile .dacts .minibtn{white-space:nowrap;text-decoration:none}
@media (max-width:560px){.dfile .dacts{gap:4px}.dfile .dacts .minibtn{padding:4px 7px;font-size:11px}}
/* the account chip: it opens something now, so it has to look like it does */
#uchip{cursor:pointer;position:relative}
#uchip .uchev{width:14px;height:14px;margin-left:auto;flex:none;opacity:.55}
#uchip:hover .uchev{opacity:1}
.railshut #uchip .uchev{display:none}

/* the first run: three ways into an empty cockpit */
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cols3 .eyebrow{color:var(--accent)}
@media (max-width:640px){.cols3{grid-template-columns:1fr}}

/* a condition row: field, operator, value, remove */
.condrow{display:grid;grid-template-columns:minmax(120px,1.6fr) minmax(96px,.9fr) minmax(110px,1.3fr) auto;
  gap:7px;margin-bottom:7px;align-items:center}
.condrow .condv{min-width:0}
.condrow span.condv{font-size:11px;color:var(--dim);padding:0 4px}
@media (max-width:620px){.condrow{grid-template-columns:1fr 1fr;}
  .condrow .minibtn{grid-column:1 / -1;justify-self:start}}

/* ---- WhatsApp ---- */
.varrow{position:relative;margin-top:6px}
.varpick{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(420px,92vw);
  background:var(--coal);border:1px solid var(--line2);box-shadow:0 14px 40px var(--shadow)}
.varhead{display:flex;gap:8px;padding:9px;border-bottom:1px solid var(--line)}
.varhead input{flex:1;min-width:0}
.varlist{max-height:320px;overflow:auto;padding:8px 9px 11px}
.varlist .eyebrow{margin:9px 0 5px}
.varopt{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 8px;color:var(--tx);font-family:inherit}
.varopt:hover,.varopt:focus{background:var(--line);outline:none}
.varopt b{display:block;font-size:13px;font-weight:500}
.varopt code{display:block;font-size:11px;color:var(--accent);margin-top:2px}
.varopt i{display:block;font-size:11px;color:var(--warn-ink);margin-top:3px;font-style:normal}

.wapreview{background:var(--wa-bg);border:1px solid var(--line2);border-radius:2px;padding:12px 14px;
  max-width:460px}
.wapreview b{display:block;font-size:13px;margin-bottom:5px}
.wapreview p{margin:0;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.wapreview i{display:block;font-size:11px;color:var(--dim);margin-top:7px;font-style:normal}

.tierbar{display:flex;gap:4px;margin-top:14px}
.tierstep{flex:1;min-width:0;border:1px solid var(--line2);padding:8px 6px;text-align:center}
.tierstep span{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tierstep.done{background:var(--line);border-color:var(--line2)}
.tierstep.done span{color:var(--mut)}
.tierstep.at{background:var(--ember);border-color:var(--ember)}
.tierstep.at span{color:var(--lime-ink);font-weight:600}

.capbar{height:10px;background:var(--line);border:1px solid var(--line2);margin-top:8px}
.capfill{height:100%;background:var(--ok)}
.capfill.half{background:var(--warn)}
.capfill.full{background:var(--bad)}

.failrow{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.failrow:last-child{border-bottom:0}
.failn{flex:0 0 42px;font-family:var(--d);font-size:20px;color:var(--bad-ink);text-align:right}
.failrow .t{flex:1;min-width:0}
.failrow .t b{display:block;font-size:13.5px}
.failrow .t span{font-size:11px;color:var(--dim)}
.failwhy{margin:7px 0 0;font-size:12.5px;color:var(--mut);line-height:1.5}
.failfix{margin:5px 0 0;font-size:12.5px;color:var(--tx);line-height:1.5}
@media (max-width:560px){.tierbar{flex-wrap:wrap}.tierstep{flex:1 0 46%}}

/* a record's human reference, beside its name */
.refchip{font-family:var(--d);font-size:12px;letter-spacing:.08em;color:var(--dim);
  border:1px solid var(--line2);padding:3px 7px;vertical-align:middle;white-space:nowrap}
.scanbox{border-style:dashed;border-color:var(--line2);border-width:1px;border-radius:2px;padding:14px}

/* ---- the inbox: a list of conversations and one of them, open ----
   Two panes on a desktop, one at a time on a phone, because a chat list and a
   chat side by side on a 375px screen is two useless columns. */
.inbox2{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;
  align-items:start;min-height:60vh}
.threadlist{display:flex;flex-direction:column;gap:6px;max-height:72vh;overflow:auto;
  padding-right:4px}
.threadrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  background:var(--char);border:1px solid var(--line);border-radius:2px;padding:10px 12px;
  cursor:pointer;color:inherit;font:inherit}
.threadrow:hover{background:var(--char2)}
.threadrow.on{border-color:var(--accent)}
.threadrow.unread b{color:var(--tx)}
.threadrow .tr1{display:flex;align-items:center;gap:7px}
.threadrow .tr1 b{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.threadrow .tr1 i{font-style:normal;font-size:11px;color:var(--dim)}
.threadrow .tr2{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.threadrow .tr2 .you{color:var(--dim)}
.threadrow .tr3{display:flex;gap:6px;flex-wrap:wrap}
.threadrow .dot{background:var(--accent);color:var(--lime-ink);border-radius:9px;
  font-size:10.5px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.threadview{min-height:60vh}
.convhead{display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.convhead>div:first-child{flex:1;min-width:140px;display:flex;flex-direction:column}
.convhead b{font-size:14.5px}
.convhead span{font-size:11.5px;color:var(--dim)}
.convbody{flex:1;overflow:auto;max-height:52vh;padding:14px;display:flex;
  flex-direction:column;gap:9px}
.bub{max-width:76%;align-self:flex-start;background:var(--char2);border-radius:10px 10px 10px 2px;
  padding:8px 11px}
.bub.out{align-self:flex-end;background:var(--lime-wash);border-radius:10px 10px 2px 10px}
.bubtext{font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bubfoot{font-size:10.5px;color:var(--dim);margin-top:3px}
.convsend{border-top:1px solid var(--line);padding:12px 14px}
.convsend textarea{width:100%;resize:vertical}
.convsend .sendrow{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.convsend .sendrow .hint{flex:1;min-width:120px}
.convsend.shut{background:var(--note-bg)}
@media (max-width:900px){
  .inbox2{grid-template-columns:1fr}
  .threadlist{max-height:none}
  .convbody{max-height:46vh}
}

/* ---- the chatbot builder: steps, each with up to three options ---- */
.stepbox{border:1px solid var(--line);border-radius:2px;padding:12px;margin-top:10px}
.stephead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.stephead b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.stepbox textarea{width:100%;resize:vertical}
.opts{display:flex;flex-direction:column;gap:7px;margin:9px 0}
.optrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.optrow .optn{width:20px;height:20px;border-radius:50%;background:var(--char2);color:var(--mut);
  font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 20px}
.optrow input{flex:2;min-width:140px}
.optrow select{flex:1;min-width:130px}
.convpreview{display:flex;flex-direction:column;gap:7px;margin-top:11px;padding:11px;
  background:var(--ink);border-radius:2px;max-width:460px}
@media (max-width:560px){.optrow input,.optrow select{flex:1 1 100%}}

/* the engagement registry: one row per field, editable in place */
.recgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px 14px;margin-top:9px}
.recrow{display:flex;flex-direction:column;gap:4px;min-width:0}
.recrow label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.recrow input,.recrow select,.recrow textarea{width:100%;min-width:0}
.recrow textarea{resize:vertical}
.recrow .recval{font-size:14px;color:var(--ink);padding:7px 0;min-height:20px}
.recrow .rechint{font-size:11px;color:var(--dim);line-height:1.35}
/* a blank one is marked on the label, not by hiding the control */
.recrow.blank label{color:var(--warn-ink)}
.recrow.blank label::after{content:" \2022";color:var(--warn-ink)}
.recrow.derived .recval{color:var(--dim)}
@media (max-width:560px){.recgrid{grid-template-columns:1fr}}
/* a field typed into and not yet saved: the control itself is marked, so it
   reads as unsaved even with the bar scrolled off */
.recrow.dirty input,.recrow.dirty select,.recrow.dirty textarea{
  border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.recrow.dirty .dirtyhint{color:var(--accent)}
.recrow.dirty label{color:var(--tx2)}
.recrow.dirty.blank label::after{content:""}

/* the submit bar for those fields. Sticky, because the registry is longer than
   a screen and a save button you have to hunt for does not get pressed. */
.recbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;
  flex-wrap:wrap;margin-top:18px;padding:12px 14px;border:1px solid var(--line2);
  border-radius:2px;background:var(--char)}
.recbar.armed{border-color:var(--accent)}
.recbarsay{flex:1;min-width:200px;font-size:12.5px;color:var(--mut);line-height:1.45}
.recbar.armed .recbarsay b{color:var(--tx)}
.recbar .btn.ghost{opacity:.45}
.recbar .btn[disabled]{cursor:default}
@media (max-width:560px){.recbar .btn{flex:1}}
.scanrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.scanrow .btn{cursor:pointer}
.scanrow .hint{flex:1;min-width:180px}
.phonewrap{display:flex;gap:6px}
.phonewrap select{flex:0 0 42%;min-width:0}
.phonewrap input{flex:1;min-width:0}
.pickwrap{display:flex;gap:6px}
.pickwrap select{flex:1;min-width:0}
.pickwrap .minibtn{flex:none;width:34px;padding:0;font-size:16px;line-height:1}
.fgroup h4 em{font-style:normal;font-weight:400;color:var(--dim);font-size:12px}

/* ---- invoices on an engagement ---- */
.invlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--char)}
.invrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.invrow:last-child{border-bottom:0}
.invn{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--char2);
  border-radius:7px;padding:5px 8px;text-align:center;flex:none;line-height:1.1}
.invn i{display:block;font-style:normal;font-size:9px;color:var(--dim)}
.invrow .t{flex:1;min-width:0}
.invrow .t b{display:block;font-size:12.5px;font-weight:500}
.invrow .t span{font-size:11px;color:var(--dim)}
.invamt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.invstate{background:var(--char2);border:1px solid var(--line2);color:var(--tx);border-radius:6px;
  font-size:11.5px;padding:4px 7px}
.invadd{display:flex;align-items:center;gap:11px;margin-top:10px;flex-wrap:wrap}
.xbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:none;
  color:var(--dim);font-size:15px;line-height:1;cursor:pointer;flex:none}
.xbtn:hover{color:var(--bad-ink);border-color:var(--bad)}

/* ---- many files in one document slot ---- */
.dhead{display:flex;align-items:center;gap:8px}
.dhead b{flex:1;font-size:12.5px}
.dcount{font-family:var(--mono);font-size:10.5px;background:var(--lime-wash);color:var(--lime);
  padding:1px 7px;border-radius:20px}
.dwhen{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.dfiles{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.dfile{display:flex;align-items:center;gap:9px;background:var(--char2);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px}
.dthumb{width:34px;height:34px;border-radius:6px;overflow:hidden;flex:none;background:var(--ink);
  display:grid;place-items:center}
.dthumb img{width:100%;height:100%;object-fit:cover}
.dthumb.doc{color:var(--dim)}
.dthumb.doc svg{width:16px;height:16px}
.dmeta{flex:1;min-width:0}
.dmeta a,.dmeta b{display:block;font-size:12px;font-weight:500;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmeta a{color:var(--lime);text-decoration:none}
.dmeta a:hover{text-decoration:underline}
.dmeta i{font-style:normal;font-size:10.5px;color:var(--dim)}

/* ================= the detail drawer ================= */
.scrim{position:fixed;inset:0;background:rgba(8,9,11,.62);z-index:80;
  animation:fade .16s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,92vw);z-index:81;
  background:var(--ink);border-left:1px solid var(--line2);display:flex;flex-direction:column;
  box-shadow:-24px 0 60px var(--shadow);animation:slidein .2s cubic-bezier(.22,.7,.3,1)}
.drawerbar{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--coal);flex:none}
.drawerbody{overflow-y:auto;padding:18px 20px 40px;flex:1}
.drawerbody .ph h1{font-size:21px}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:none;
  color:var(--mut);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--tx);border-color:var(--lime)}
.iconbtn svg{width:15px;height:15px}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}}

/* ================= board tabs ================= */
.btabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:14px;
  border-bottom:1px solid var(--line);padding-bottom:0}
.btab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font-family:var(--b);font-size:13px;font-weight:500;padding:9px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;margin-bottom:-1px}
.btab:hover{color:var(--tx)}
.btab[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--lime)}
.btab b{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--char2);
  color:var(--mut);padding:1px 6px;border-radius:20px}
.btab[aria-selected="true"] b{background:var(--lime-wash);color:var(--lime)}

/* ================= overview ================= */
.kpis5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
@media(max-width:1200px){.kpis5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kpis5{grid-template-columns:repeat(2,1fr)}}
.kcard{background:var(--char);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.ktop{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.kico{width:30px;height:30px;border-radius:9px;background:var(--lime-wash);color:var(--lime);
  display:grid;place-items:center;flex:none}
.kico svg{width:16px;height:16px}
.klabel{font-size:12px;color:var(--mut);font-weight:500}
.krow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.krow b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:500;
  letter-spacing:-.03em;color:var(--tx);line-height:1.1}
.kdelta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:20px;white-space:nowrap}
.kdelta svg{width:11px;height:11px}
.kdelta.up{color:var(--ok-ink);background:rgba(111,207,142,.13)}
.kdelta.down{color:var(--bad-ink);background:rgba(242,102,79,.13)}
.kfoot{display:block;margin-top:7px;font-size:11px;color:var(--dim)}

.twocol{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:14px;align-items:start}
@media(max-width:1000px){.twocol{grid-template-columns:1fr}}
.card{background:var(--char);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.pad{padding:15px 16px}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cardhead.pad{padding:15px 16px;margin:0;border-bottom:1px solid var(--line)}
.cardhead h3{font-family:var(--d);font-size:14px;font-weight:600;flex:1;letter-spacing:-.01em}
.cardhead .hint{font-size:11px;color:var(--dim)}

/* ---- the chart ---- */
.chartwrap{position:relative}
.chart{width:100%;height:190px;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .carea{fill:var(--lime);opacity:.10}
.chart .cline{fill:none;stroke:var(--lime);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.chart .cdot{fill:var(--char);stroke:var(--lime);stroke-width:2;vector-effect:non-scaling-stroke}
.chart .chit{fill:transparent;cursor:pointer}
.chart .chit:hover+*,.chart .chit:focus{outline:none}
.cxaxis{display:flex;justify-content:space-between;margin-top:4px}
.cxaxis span{font-size:10.5px;color:var(--dim)}
.ctip{position:absolute;z-index:20;background:var(--char2);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--tx);white-space:nowrap;
  pointer-events:none;box-shadow:0 10px 26px var(--shadow);transform:translate(-50%,-135%)}

/* ---- the feed ---- */
.feed{display:flex;flex-direction:column}
.feeditem{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.feeditem:last-child{border-bottom:0}
.feeditem .av{width:30px;height:30px;border-radius:50%;background:var(--char2);color:var(--mut);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.feeditem .t{min-width:0}
.feeditem .t b{display:block;font-size:12.5px;font-weight:500;color:var(--tx);line-height:1.35}
.feeditem .t span{font-size:11px;color:var(--dim)}
td .sub{display:block;font-size:11px;color:var(--dim)}
.dimtxt{color:var(--dim)}

/* figures line up, because half these screens are money */
.num,.kpi b,.money,td.num,.ministats b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---- skin: square edges soften a little, and the accent is a
       gradient rather than a flat ember ---- */
.btn,.pill,.chip,.card,.uchip,input,select,textarea{border-radius:2px}
.head{display:none}


.demo-note{background:var(--note-bg);color:var(--note-ink);border-bottom:1px solid var(--note-line);font-weight:500;letter-spacing:.01em}
.demo-note b{color:var(--lime)}
.passcell code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--char2);border:1px solid var(--line2);border-radius:2px;padding:2px 7px;letter-spacing:.04em}
.passcell .dim{color:var(--dim);letter-spacing:.14em}
.matrix .rn span{display:block;font-size:11px;color:var(--dim);font-weight:400}

/* ---- documents, on an engagement and on a client ---- */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.docgroup{border:1px solid var(--line);background:var(--coal)}
.docgroup .eyebrow{padding:9px 12px;border-bottom:1px solid var(--line);margin:0}
.docrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.docrow:last-child{border-bottom:0}
.docrow.need{background:rgba(255,91,61,.06);box-shadow:inset 2px 0 0 0 var(--bad)}
.docrow .dl{flex:1;min-width:0}
.docrow .dl b{display:block;font-size:12.5px;font-weight:600}
.docrow .dl>span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.docrow .needline{color:var(--bad-ink)}
.docfile{display:block;font-size:11.5px;color:var(--tx);margin-top:5px;word-break:break-word}
.docfile a{color:var(--accent);text-decoration:underline}
.docfile i{font-style:normal;color:var(--dim)}
.docfile i.nostore{color:var(--warn-ink)}
.upl{flex:none;cursor:pointer;font-family:var(--d);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);border:1px solid var(--line2);border-radius:2px;
  padding:5px 10px;white-space:nowrap}
.upl:hover{color:var(--tx);border-color:var(--ember)}
.bar{display:block;height:6px;background:var(--char2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);transition:width .2s ease}
/* a document that somebody outside can open, said on the row */
.dshare{display:block;grid-column:1/-1;margin-top:6px;font-size:11.5px;color:var(--dim)}
.minibtn.on{border-color:var(--ember);color:var(--tx)}
/* the one number everybody asks about, beside the stage rather than buried */
.oppval{font-family:var(--d);font-size:15px;color:var(--tx);white-space:nowrap}
.oppval.none{color:var(--dim);font-weight:400;font-size:13px}
/* the diary, read a day at a time */
.dayblock{margin-bottom:18px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 0 7px}
.dayhead b{font-family:var(--d);font-size:14px}
.dayhead span{color:var(--dim);font-size:11.5px}
/* how a meeting happens: three choices, one row, big enough to tap */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.modepick{display:flex;align-items:center;gap:7px;background:var(--char2);
  border:1px solid var(--line2);border-radius:2px;padding:9px 13px;font-size:12.5px;
  cursor:pointer;min-height:40px}
.modepick:hover{border-color:var(--ember)}
.modepick:has(input:checked){border-color:var(--ember);background:var(--char2)}
.modepick input{accent-color:var(--ember);margin:0}
.picked{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;align-items:center}
/* the client already chosen, shown as a fact rather than an empty control */
.picked>b{font-family:var(--d);font-size:14px}
.picked>span{color:var(--dim);font-size:11.5px;border-left:1px solid var(--line2);padding-left:7px}
.picked>.minibtn{margin-left:auto}
.pickchip{background:var(--char2);border:1px solid var(--line2);border-radius:2px;color:var(--tx);
  font-size:11.5px;padding:5px 9px;cursor:pointer}
.pickchip:hover{border-color:var(--ember)}
.pickchip i{font-style:normal;color:var(--dim);margin-left:4px}

.demo-note{background:var(--ember);color:var(--lime-ink);text-align:center;font-size:12px;padding:7px var(--pad);font-weight:500}

/* ---- login ---- */
:root[data-theme="light"] .railhead img,
:root[data-theme="light"] .logincard > img{filter:invert(1) hue-rotate(180deg)}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:30px var(--pad)}
.logincard{width:100%;max-width:400px;background:var(--coal);border:1px solid var(--line);padding:30px}
.logincard img{height:28px;margin-bottom:22px}
.logincard h1{font-size:22px;font-weight:600;margin-bottom:5px}
.logincard .sub{color:var(--mut);font-size:13px;margin:0 0 22px}
.creds{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.creds h4{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.creds button{
  display:flex;width:100%;gap:10px;align-items:baseline;background:none;border:1px solid var(--line);
  padding:8px 11px;margin-bottom:5px;cursor:pointer;text-align:left;
}
.creds button:hover{border-color:var(--ember)}
.creds b{font-family:var(--d);font-weight:600;font-size:13px}
.creds span{color:var(--dim);font-size:11.5px;margin-left:auto}
.creds em{font-style:normal;color:var(--mut);font-size:12px}

/* ---- header ---- */
.head{
  background:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;padding:12px var(--pad);flex-wrap:wrap;
}
.brand{display:none}
.brand img{height:26px;width:26px;border-radius:50%;box-shadow:var(--glow)}
.wm{font-family:var(--logo);font-style:italic;font-weight:700;font-size:18px;letter-spacing:.11em;
  text-transform:uppercase;line-height:1;padding-right:.22em;display:inline-block;
  background:linear-gradient(178deg,#FFFFFF 4%,#C6CDD6 34%,#8C949F 54%,#EDF1F5 74%,#AEB6C0 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--chrome);
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65))}
.brand em{
  font-family:var(--d);font-style:normal;font-size:9.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
  border-left:1px solid var(--line);padding-left:11px;
}
.nav{display:flex;gap:3px;flex-wrap:wrap;margin-left:8px}
.nav a{
  color:var(--mut);padding:7px 11px;font-family:var(--d);font-size:12.5px;font-weight:500;
  border-bottom:2px solid transparent;
}
.nav a:hover{color:var(--tx)}
.nav a.on{color:var(--tx);border-bottom-color:var(--ember)}
.nav a i{font-style:normal;background:var(--ember);color:var(--lime-ink);font-size:10px;padding:1px 5px;margin-left:5px}
.uchip-legacy{
  margin-left:auto;display:flex;align-items:center;gap:9px;cursor:pointer;
  border:1px solid var(--line);background:none;padding:6px 11px;
}
.uchip:hover{border-color:var(--ember)}
.uchip b{font-family:var(--d);font-size:12.5px;font-weight:600}
.uchip span{font-size:11px;color:var(--dim)}
.av{width:26px;height:26px;background:var(--ember);color:var(--lime-ink);display:grid;place-items:center;font-family:var(--d);font-weight:700;font-size:11px;flex:none}

.wrap{max-width:1600px;margin:0 auto;padding:clamp(16px,2.6vw,28px) var(--pad) 70px}

/* ---- shared bits ---- */
.eyebrow{
  font-family:var(--d);font-size:10.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);
  display:inline-flex;align-items:center;gap:9px;margin:0 0 14px;
}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--ember);flex:none}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(20px,2.6vw,28px);font-weight:600}
.ph p{color:var(--mut);margin:4px 0 0;font-size:13px}
.ph .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{
  /* ⚠️ --ember IS the lime here, so white text on it was invisible: the Send
     button read as a blank lime rectangle. --lime-ink exists for exactly this
     and every primary button in the console was getting it wrong, not just one. */
  background:var(--ember);color:var(--lime-ink);border:0;padding:9px 16px;cursor:pointer;
  font-family:var(--d);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.btn:hover{background:var(--ember-dk)}
.btn.alt{background:none;border:1px solid var(--line2);color:var(--mut)}
.btn.alt:hover{border-color:var(--ember);color:var(--accent)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.minibtn{background:none;border:1px solid var(--line2);color:var(--mut);font-size:11px;padding:5px 9px;cursor:pointer;font-family:var(--d);letter-spacing:.06em;text-transform:uppercase}
.minibtn:hover{border-color:var(--ember);color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}

.card{background:var(--coal);border:1px solid var(--line);padding:18px}
.card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.card p.m{color:var(--mut);font-size:13px;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--coal);padding:16px 17px;position:relative}
.kpi b{display:block;font-family:var(--d);font-size:clamp(19px,2.2vw,27px);font-weight:700;line-height:1.05}
.kpi span{display:block;font-size:11.5px;color:var(--mut);margin-top:5px}
.kpi.warn b{color:var(--warn-ink)}
.kpi.bad b{color:var(--bad-ink)}
.kpi.ok b{color:var(--ok-ink)}
.kpi[data-tip]{cursor:help}
.kpi[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:12px;right:12px;top:100%;z-index:20;
  background:var(--paper);color:var(--paper-ink);padding:10px 12px;font-size:12px;line-height:1.45;
  box-shadow:0 14px 34px var(--shadow);
}

.pill{font-family:var(--d);font-size:10.5px;font-weight:600;padding:3px 8px;display:inline-block;letter-spacing:.06em;text-transform:uppercase}
.pill.ok{background:rgba(59,176,107,.16);color:var(--ok-ink)}
.pill.warn{background:rgba(224,163,46,.16);color:var(--warn-ink)}
.pill.bad{background:rgba(228,85,63,.16);color:var(--bad-ink)}
.pill.info{background:rgba(91,155,213,.16);color:var(--info-ink)}
.pill.dim{background:var(--line);color:var(--mut)}
.pill.em{background:var(--ember);color:var(--lime-ink)}

.bar{width:74px;height:6px;background:var(--line);display:inline-block;position:relative;vertical-align:middle}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ember);display:block}
.masked{color:var(--dim);cursor:help;font-family:var(--d)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--coal);color:var(--mut);padding:7px 12px;cursor:pointer;
  font-family:var(--d);font-size:12px;font-weight:500;
}
.chip:hover{color:var(--tx)}
.chip[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--lime-ink)}
.chip i{font-style:normal;opacity:.7;margin-left:5px}

.tabs{display:flex;gap:0;margin:0 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer;
  font-family:var(--d);font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:11px 17px;
}
.tab.on{color:var(--tx);border-bottom-color:var(--ember)}

/* ---- what is in play, and its follow-ups ---- */
.stagepick{display:flex;align-items:center;gap:8px;background:var(--coal);border:1px solid var(--ember);padding:6px 10px}
.stagepick label{font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stagepick select{background:var(--ink);border:1px solid var(--line);color:var(--tx);padding:7px 10px;font-family:var(--d);font-size:13.5px;font-weight:600;cursor:pointer}
.stagenote{color:var(--mut);font-size:13px;margin:-8px 0 18px}

.playproductd{border:1px solid var(--ember);background:var(--coal);margin-bottom:12px}
.playhead{display:flex;gap:13px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.playhead img{width:78px;height:56px;object-fit:cover;flex:none;background:var(--char)}
.playhead .t{flex:1;min-width:150px}
.playhead b{font-family:var(--d);font-size:16px;font-weight:600;display:block}
.playhead span{font-size:12.5px;color:var(--mut)}
.playmeta{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.playacts{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.follist{border-top:1px solid var(--line);background:var(--ink)}
.playline{display:block;font-family:var(--d);font-size:12.5px;color:var(--accent);margin-top:5px}
.cardstage{
  width:100%;margin-top:9px;background:var(--char);border:1px solid var(--line2);color:var(--mut);
  padding:6px 8px;font-family:var(--d);font-size:11.5px;font-weight:600;cursor:pointer;
}
.cardstage:hover{border-color:var(--ember);color:var(--tx)}
.colhelp{padding:0 14px 10px;font-size:11px;color:var(--dim);line-height:1.4;border-bottom:1px solid var(--line)}
.mk + .play,.minibtn.play{border-color:var(--ember);color:var(--accent)}

.scorechip{
  flex:none;align-self:center;border:1px solid var(--line2);background:var(--char);cursor:pointer;
  font-family:var(--d);font-size:15px;font-weight:700;padding:6px 10px;color:var(--mut);
}
.scorechip span{font-size:10px;font-weight:500;opacity:.7}
.scorechip.ok{border-color:var(--ok);color:var(--ok-ink)}
.scorechip.warn{border-color:var(--warn);color:var(--warn-ink)}
.scorechip.bad{border-color:var(--bad);color:var(--bad-ink)}
.scorechip:hover{background:var(--line)}

.scorebar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--char);border-left:3px solid var(--line2);padding:9px 13px;margin-top:9px;min-height:42px}
.scorebar b{font-family:var(--d);font-size:19px;font-weight:700}
.scorebar b span{font-size:11px;opacity:.6}
.scorebar .v{font-size:12.5px;color:var(--mut)}
.scorebar .missing{font-size:11px;color:var(--dim);width:100%}
.scorebar.ok{border-left-color:var(--ok)} .scorebar.ok b{color:var(--ok-ink)}
.scorebar.warn{border-left-color:var(--warn)} .scorebar.warn b{color:var(--warn-ink)}
.scorebar.bad{border-left-color:var(--bad)} .scorebar.bad b{color:var(--bad-ink)}

/* ---- activity log ---- */
.actrow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.actrow:last-child{border-bottom:0}
.actrow:hover{background:var(--char)}
.acttime{font-family:var(--d);font-size:12px;color:var(--dim);flex:none;width:42px;padding-top:4px}
.actrow .av{margin-top:2px}
.actrow .t{flex:1;min-width:0}
.actrow b{font-family:var(--b);font-size:13.5px;font-weight:500;display:block;color:var(--tx2);line-height:1.45}
.actrow .meta{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.actrow .go{flex:none;align-self:center;display:flex;gap:5px;flex-wrap:wrap}

/* ---- follow-ups ---- */
.micbtn{
  background:var(--char);border:1px solid var(--line2);color:var(--mut);
  padding:7px 12px;cursor:pointer;font-family:var(--d);font-size:12px;font-weight:600;flex:none;
}
.micbtn:hover{border-color:var(--ember);color:var(--accent)}
.micbtn.rec{background:var(--bad);border-color:var(--bad);color:var(--on-bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.folrow{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.folrow:last-child{border-bottom:0}
.folrow .dot{width:8px;height:8px;flex:none;margin-top:6px;background:var(--line2)}
.folrow .dot.done{background:var(--ok)}
.folrow .dot.over{background:var(--bad)}
.folrow .dot.soon{background:var(--warn)}
.folrow .t{flex:1;min-width:0}
.folrow b{font-family:var(--d);font-size:13.5px;font-weight:600;display:block}
.folrow p{margin:4px 0 0;font-size:13px;color:var(--mut)}
.folrow .meta{font-size:11.5px;color:var(--dim);margin-top:5px;display:block}
.nextup{
  display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  background:var(--char);border-left:3px solid var(--ember);padding:13px 16px;margin-bottom:14px;
}
.nextup b{font-family:var(--d);font-size:15px}
.nextup.over{border-left-color:var(--bad)}
.nextup.none{border-left-color:var(--warn)}

/* ---- pipeline board ---- */
.board.pipe{grid-template-columns:repeat(7,minmax(190px,1fr));overflow-x:auto;padding-bottom:6px}
.board.pipe .col{min-width:190px}
.colsum{padding:7px 14px;border-bottom:1px solid var(--line);font-family:var(--d);font-size:11.5px;color:var(--dim)}
.oppmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.oppmeta span{font-size:10.5px;color:var(--dim)}
.oppbud{display:block;font-family:var(--d);font-size:12.5px;font-weight:600;color:var(--mut);margin-top:5px}

.stagestrip{display:flex;gap:2px;flex-wrap:wrap}
.stagebtn{
  flex:1;min-width:104px;background:var(--coal);border:1px solid var(--line);color:var(--dim);
  padding:10px 8px;cursor:pointer;font-family:var(--d);font-size:11.5px;font-weight:600;
}
.stagebtn:hover{color:var(--tx);border-color:var(--line2)}
.stagebtn.done{background:rgba(241,98,58,.14);color:var(--mut);border-color:rgba(241,98,58,.3)}
.stagebtn.now{background:var(--ember);border-color:var(--ember);color:var(--lime-ink)}
.tin{background:var(--char);border:1px solid var(--line);padding:6px 8px;width:74px;font-size:13px;color:var(--tx);font-family:var(--d)}
.tin.wide{width:116px}

/* ---- back bar, under the logo on every page but home ---- */
#backwrap:empty{display:none}
.backbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--coal);border-bottom:1px solid var(--line);
  padding:9px var(--pad);position:sticky;top:53px;z-index:35;
}
.backbtn{
  display:inline-flex;align-items:center;gap:7px;background:none;
  border:1px solid var(--line2);color:var(--tx);padding:7px 14px 7px 10px;cursor:pointer;
  font-family:var(--d);font-size:12.5px;font-weight:600;letter-spacing:.04em;
}
.backbtn:hover{border-color:var(--ember);color:var(--accent)}
.backbtn svg{width:15px;height:15px;flex:none}
.crumb{font-size:12px;color:var(--dim)}
.crumb:hover{color:var(--mut)}
.crumb-sep{color:var(--line2);font-size:12px}
.crumb.now{color:var(--mut);text-transform:capitalize}

/* ---- the shared date window ---- */
.rangebar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--coal);border:1px solid var(--line);padding:10px 13px;margin-bottom:18px;
}
.rlabel{font-family:var(--d);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.rangebar .chip{padding:5px 10px;font-size:11.5px}
.rcustom{display:flex;align-items:center;gap:6px;margin-left:4px}
.rcustom input{background:var(--char);border:1px solid var(--line);padding:5px 8px;font-size:12.5px;color:var(--tx)}
.rcustom span{font-size:12px;color:var(--dim)}
.rnote{margin-left:auto;font-size:11.5px;color:var(--dim)}

/* ---- people ---- */
.av.big{width:44px;height:44px;font-size:16px}
.av.sm{width:24px;height:24px;font-size:10px}
.person{cursor:pointer;transition:.15s}
.person:hover{border-color:var(--ember)}
.ministats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.ministats div{background:var(--coal);padding:9px 10px;text-align:center}
.ministats b{display:block;font-family:var(--d);font-size:17px;font-weight:700;line-height:1.1}
.ministats span{font-size:10.5px;color:var(--dim)}
.tprog{margin-top:12px}
.tprow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mut);margin-bottom:5px}
.tprow b{font-family:var(--d);font-size:14px}
.bar.wide{width:100%;height:8px;display:block}
.bar i.ok{background:var(--ok)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.bar i.dim{background:var(--line2)}
.tpct{font-family:var(--d);font-size:22px;font-weight:700}
.tpct.ok,b.ok{color:var(--ok-ink)}
.tpct.warn,b.warn{color:var(--warn-ink)}
.tpct.bad,b.bad{color:var(--bad-ink)}
.tpct.dim,b.dim{color:var(--dim)}

/* ---- month-by-month ---- */
.spark{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.spark .sbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:30px}
.spark .sbar span{width:100%;background:var(--ember);display:block;min-height:3px}
.spark .sbar em{font-style:normal;font-size:10.5px;color:var(--dim);margin-top:6px}
.spark .sbar b{font-family:var(--d);font-size:12px;color:var(--mut)}

/* ---- tables ---- */
.scroller{overflow:auto;max-height:72vh;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;background:var(--coal);font-size:13px}
.tbl th{
  text-align:left;font-family:var(--d);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);padding:11px;border-bottom:1px solid var(--line);
  white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--char);z-index:2;
}
.tbl th:hover{color:var(--accent)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--char)}
.tbl .num{text-align:right;font-family:var(--d);font-weight:600}
.tbl th.num{font-family:var(--d)}
.tbl td.tcol,.tbl th.tcol{text-align:right;white-space:nowrap}
.tbl td.tcol .bar{margin-right:8px}
.tbl td.tcol b{font-family:var(--d);display:inline-block;min-width:44px;text-align:right}
.veh{display:flex;align-items:center;gap:10px;min-width:200px}
.veh img{width:44px;height:32px;object-fit:cover;flex:none;background:var(--char)}
.veh b{font-weight:600;display:block}
.veh span{font-size:11.5px;color:var(--dim)}
.empty{padding:34px;text-align:center;color:var(--dim)}

/* ---- forms ---- */
.fgroup{border:1px solid var(--line);background:var(--coal);margin-bottom:12px}
.fgroup>h4{
  font-family:var(--d);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line);margin:0;
}
.fbody{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.f label{display:block;font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.f input,.f select,.f textarea{
  width:100%;background:var(--char);border:1px solid var(--line);padding:9px 11px;font-size:14px;color:var(--tx);
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ember);outline:none}
.f textarea{min-height:76px;resize:vertical;font-family:var(--b)}
.f.wide{grid-column:1/-1}
.f .unit{color:var(--dim);font-size:11px;margin-left:5px;text-transform:none;letter-spacing:0}
.err{color:var(--bad-ink);font-size:13px;margin:10px 0 0;min-height:20px}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}

/* ---- the record editor: published vs missing ---- */
.fieldset{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.fld{background:var(--coal);padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:54px}
.fld.miss{background:var(--char2)}
.fld .k{font-size:11px;color:var(--dim);display:block}
.fld .v{font-family:var(--d);font-size:14px;font-weight:600;display:block;word-break:break-word}
.fld .v.none{color:var(--dim);font-weight:400;font-family:var(--b);font-size:13px;font-style:italic}
.fld .go{margin-left:auto;flex:none}
.fld input,.fld select,.fld textarea{width:100%;background:var(--ink);border:1px solid var(--ember);padding:6px 8px;font-size:13.5px;color:var(--tx)}
.fld form{display:flex;gap:6px;align-items:center;width:100%}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.progress .bar{width:180px;height:9px}
.progress b{font-family:var(--d);font-size:16px;font-weight:700}

/* ---- the pipeline boards ---- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.col{background:var(--coal);border:1px solid var(--line);min-height:120px}
.col>h4{font-family:var(--d);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.col>h4 i{font-style:normal;margin-left:auto;color:var(--tx)}
.vcard{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.vcard:last-child{border-bottom:0}
.vcard:hover{background:var(--char)}
.vcard b{font-family:var(--d);font-size:14px;font-weight:600;display:block}
.vcard span{font-size:11.5px;color:var(--mut);display:block;margin-top:2px}

/* ---- mark buttons ---- */
.marks{display:flex;gap:4px;flex-wrap:wrap}
.mk{border:1px solid var(--line);background:var(--char);color:var(--mut);font-size:11px;padding:5px 9px;cursor:pointer;font-family:var(--d);font-weight:500}
.mk:hover{color:var(--tx);border-color:var(--line2)}
.mk[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--lime-ink)}
.mk[aria-pressed="true"][data-m="rejected"]{background:var(--bad);border-color:var(--bad)}
.mk[aria-pressed="true"][data-m="bought"]{background:var(--ok);border-color:var(--ok)}

.pickrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:0}
.pickrow img{width:60px;height:44px;object-fit:cover;flex:none;background:var(--char)}
.pickrow .t{min-width:0;flex:1}
.pickrow b{font-family:var(--d);font-size:13.5px;font-weight:600;display:block}
.pickrow span{font-size:11.5px;color:var(--dim)}

/* ---- inbox ---- */
.msg{background:var(--coal);border:1px solid var(--line);padding:16px;margin-bottom:12px}
.msghead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.msghead b{font-family:var(--d);font-size:14px;font-weight:600}
.msghead span{font-size:11.5px;color:var(--dim)}
.body{background:var(--char);padding:12px 14px;font-size:13.5px;margin-bottom:12px;border-left:2px solid var(--line2)}
.capture{border:1px solid var(--ember);padding:14px}
.capture h4{font-family:var(--d);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.kvs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.kvs span{background:var(--char);border:1px solid var(--line);font-size:12px;padding:4px 9px}
.kvs span b{font-family:var(--d);color:var(--mut);font-weight:500;margin-right:5px}

/* ---- settings matrix ---- */
.matrix{width:100%;border-collapse:collapse;background:var(--coal);border:1px solid var(--line);font-size:13px}
.matrix th{font-family:var(--d);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:11px 9px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child{text-align:left}
.matrix td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:center}
.matrix td:first-child{text-align:left}
.matrix tr:last-child td{border-bottom:0}
.matrix input[type=checkbox]{width:17px;height:17px;accent-color:var(--ember);cursor:pointer}
.matrix select{background:var(--char);border:1px solid var(--line);padding:6px 8px;font-size:12.5px;cursor:pointer}
.matrix tr.locked{opacity:.55}
.matrix .rn{font-family:var(--d);font-weight:600}
.matrix .rn span{display:block;font-family:var(--b);font-weight:400;font-size:11.5px;color:var(--dim)}

.conn{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.conn b{font-family:var(--d);font-size:14px;font-weight:600;display:block}
.conn span{font-size:12px;color:var(--mut)}
.conn .pill{margin-left:auto;flex:none}

.finding{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}
.finding .sev{width:7px;height:7px;background:var(--bad);flex:none;margin-top:7px}
.finding .sev.warn{background:var(--warn)}
.finding .sev.info{background:var(--dim)}
.finding h4{font-family:var(--d);font-size:13.5px;font-weight:600;margin:0 0 3px}
.finding p{margin:0;font-size:12.5px;color:var(--mut)}
.finding p b{color:var(--tx2);font-weight:600}
.finding .go{margin-left:auto;flex:none;align-self:center}

.note{background:var(--char);border-left:3px solid var(--ember);padding:12px 15px;font-size:13px;color:var(--mut);margin:12px 0}
.deny{background:var(--coal);border:1px solid var(--line);padding:40px 30px;text-align:center}
.deny h3{font-size:18px;margin-bottom:8px}
.deny p{color:var(--mut);margin:0 auto;max-width:440px}

/* ---- modal + toast ---- */
dialog{border:0;padding:0;background:var(--coal);color:var(--tx);max-width:min(980px,94vw);width:100%;border:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.8)}
.dhead{position:sticky;top:0;background:var(--char);z-index:2;display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:18px;font-weight:600}
.dhead p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.dclose{margin-left:auto;background:none;border:1px solid var(--line2);width:32px;height:32px;cursor:pointer;flex:none;font-size:17px}
.dclose:hover{border-color:var(--ember);color:var(--accent)}
.dbody{padding:20px;max-height:min(76vh,830px);overflow:auto}
.sec{font-family:var(--d);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:22px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.ledger li:last-child{border-bottom:0}
.ledger span{color:var(--mut);font-size:13px}
.ledger b{font-family:var(--d);font-weight:600}
.ledger li.tot b{color:var(--accent);font-size:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px}
.dthumbs img{aspect-ratio:4/3;object-fit:cover;background:var(--char)}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--paper);color:var(--paper-ink);padding:12px 20px;font-size:13.5px;font-weight:500;
  box-shadow:0 18px 44px var(--shadow);max-width:90vw;
}

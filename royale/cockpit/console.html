<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gifting Cockpit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233D2F86%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-style=%22italic%22%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>/* theme before first paint: light unless this person picked dark */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('gc_theme')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<style>
/* ---- tokens. --brand / --accent are overwritten at boot from the tenant
       profile, so another company's colours need no CSS edit. ---- */
:root{
  --brand:#3D2F86; --brand-2:#5A4BB0; --brand-soft:#EFEDF9; --brand-ink:#3D2F86;
  --accent:#C6F432; --accent-soft:#F1FFD0;
  --ink:#16141F; --ink2:#34313F; --muted:#5E5B6B; --dim:#6E6B7A;
  --line:#ECEAF1; --line2:#DCD9E4; --bg:#FAFAF8; --card:#FFFFFF; --sunk:#F5F4F8; --topbg:rgba(250,250,248,.86);
  --ok:#17703D; --ok-soft:#E4F4EA; --warn:#8A4E00; --warn-soft:#FDF1DE;
  --bad:#B3261E; --bad-soft:#FCE8E6; --info:#265C9E; --info-soft:#E6EEF9;
  --agent:linear-gradient(135deg,#3D2F86 0%,#6A45C9 100%);
  --agent-soft:#F3EEFC; --agent-ink:#5B34B8; --agent-line:#DCCFF6;
  --r:12px; --r-sm:8px; --r-lg:18px;
  --shadow:0 1px 2px rgba(22,20,31,.04),0 4px 14px rgba(22,20,31,.05);
  --shadow-lg:0 24px 60px rgba(22,20,31,.18);
  --d:'Inter',-apple-system,system-ui,sans-serif;
  --b:'Inter',-apple-system,system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --script:var(--serif);
  --ease:cubic-bezier(.2,.8,.2,1);
  --side:240px;
}
/* dark: one tap away, never forced by the OS */
:root[data-theme=dark]{
  --brand:#6B5BD6; --brand-2:#7D6EE0; --brand-soft:#26213F; --brand-ink:#B7AEF0;
  --accent-soft:#2A3214;
  --ink:#ECEAF2; --ink2:#D5D2DE; --muted:#A9A6B5; --dim:#9592A3;
  --line:#2A2738; --line2:#3A3650; --bg:#141220; --card:#1C1A28; --sunk:#232032; --topbg:rgba(20,18,32,.86);
  --ok:#6FD49A; --ok-soft:#173326; --warn:#F0B45C; --warn-soft:#3A2A12;
  --bad:#FF8A80; --bad-soft:#3D1C1A; --info:#8AB4F8; --info-soft:#18273D;
  --agent-soft:#241F3A; --agent-ink:#C3B5F5; --agent-line:#3E3466;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--d);margin:0;line-height:1.2;letter-spacing:-.02em;font-weight:650}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.script{font-family:var(--serif);font-style:italic;color:var(--brand-ink);font-weight:400}

/* ---- login ---- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 85% 15%,var(--brand-soft),transparent 45%),radial-gradient(circle at 10% 90%,var(--accent-soft),transparent 40%),var(--bg)}
.lcard{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;box-shadow:var(--shadow-lg)}
.lcard .script{font-size:46px;line-height:1;text-align:center}
.lcard .sub{text-align:center;color:var(--muted);margin:6px 0 22px}
.lcard .quick{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.lcard .quick p{font-size:13px;color:var(--muted);margin:0 0 8px}
.lcard .quick div{display:flex;flex-wrap:wrap;gap:6px}
.lnote{font-size:13px;color:var(--dim);text-align:center;margin-top:16px}

/* ---- shell ---- */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px}
.brandmark{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brandmark .m{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:24px}
.brandmark b{display:block;font-family:var(--d);font-size:14px}
.brandmark small{color:var(--muted);font-size:12.5px}
.side .grp{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:14px 10px 4px}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:44px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.side a i{font-style:normal;width:20px;height:20px;display:grid;place-items:center;flex:none}
.side a i svg{width:20px;height:20px;stroke-width:1.75}
.side a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:#111;border-radius:99px;padding:0 7px;line-height:18px}
.side a em.agent{background:var(--agent);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .spacer{flex:1}
.demo-pill{font-size:11.5px;font-weight:700;background:var(--accent);color:#111;border-radius:99px;padding:3px 10px}
.uchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;font-size:13.5px;min-height:44px}
.uchip b{display:block;font-size:12.5px;line-height:1.2}
.uchip span.r{color:var(--muted);font-size:12.5px}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.wrap{padding:24px clamp(14px,3vw,36px) 80px;max-width:1440px;width:100%}
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.backbtn{border:0;background:none;display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--brand-ink);font-weight:600;padding:0}
.backbtn svg{width:16px;height:16px}

/* ---- the menu folds away on any screen size ---- */
.burger{border:0;background:none;width:38px;height:38px;border-radius:10px;font-size:20px;display:grid;place-items:center;color:var(--ink);margin-left:-8px}
.burger:hover{background:var(--sunk)}
body.navc #app{grid-template-columns:1fr}
body.navc .side{display:none}

/* ---- the top of every screen stays put; the rest scrolls under it ---- */
.ph{position:sticky;top:60px;z-index:15;background:var(--bg);padding:12px 0;margin-top:-12px}
.stickyhead{position:sticky;top:60px;z-index:15;background:var(--bg);padding:12px 0 14px;margin:-12px 0 16px;box-shadow:0 12px 12px -14px rgba(22,20,31,.35)}
.stickyhead .ph{position:static;padding:0;margin:0 0 12px}
.stickyhead .stagebar{margin:0}
.kpis.slim .kpi{padding:9px 14px;box-shadow:none}
.kpis.slim .kpi b{font-size:18px}

/* ---- type & layout ---- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:28px}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.stickyhead .ph{flex-wrap:nowrap}
.stickyhead .ph .acts{flex:none;max-width:440px;justify-content:flex-end}
.stickyhead .tabs{margin:14px 0 0}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.eyebrow:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.pad0{padding:0}
.card h3{font-size:15px;margin-bottom:10px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .hd h3{margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---- controls ---- */
.btn{border:0;border-radius:var(--r-sm);padding:11px 18px;min-height:44px;transition:background .16s var(--ease),transform .16s var(--ease);background:var(--brand);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.lime{background:var(--accent);color:#111}
.btn.agent{background:var(--agent);color:#fff}
.btn.bad{background:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.minibtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 12px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.minibtn:hover{border-color:var(--brand);color:var(--brand-ink)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=time],input[type=search],input:not([type]),select,textarea{
  width:100%;padding:11px 13px;min-height:44px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.inline input,.inline select{width:auto}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:8px 14px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;min-height:36px;cursor:pointer;user-select:none;font-size:14px}
.chk input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* ---- pills, kpis, tables ---- */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.em{background:var(--brand);color:#fff;border-color:transparent}
.pill.dim{color:var(--muted)}
.pill.agent{background:var(--agent);color:#fff;border-color:transparent}
.pill.lime{background:var(--accent);color:#111;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.kpi b{display:block;font-family:var(--d);font-size:28px;line-height:1.15;font-weight:650;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13.5px}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.kpi[data-go]{cursor:pointer}
.scroller{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-weight:600}
.tbl td small{display:block;color:var(--muted);font-size:13px}
.bar{display:inline-block;width:80px;height:6px;background:var(--line);border-radius:9px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.deny{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:40px 24px;text-align:center;max-width:620px;margin:40px auto}
.deny h3{margin-bottom:8px}
.deny p{color:var(--muted);margin:0}
.item{display:flex;gap:12px;align-items:center;padding:14px 18px;min-height:56px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item h4{font-size:15px;font-family:var(--b);font-weight:600}
.item p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--info)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--ok)}
.thumb{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;font-family:var(--d)}
.thumb.lg{width:100%;height:170px;border-radius:12px;font-size:40px}
.rangebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.rangebar .rnote{font-size:12px;color:var(--muted);margin-left:6px}
.rangebar .rcustom{display:inline-flex;gap:6px;align-items:center}
.rangebar .rcustom input{width:auto;padding:5px 8px}

/* ---- boards ---- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.col h4{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font-family:var(--b);font-weight:700}
.col h4 small{color:var(--muted);font-weight:500}
.deal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.deal:hover{border-color:var(--brand)}
.deal b{display:block;font-size:14.5px}
.deal .co{font-size:13px;color:var(--muted)}
.deal .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;gap:6px}
.deal.risk{box-shadow:inset 3px 0 0 var(--bad)}
.deal.warnl{box-shadow:inset 3px 0 0 var(--warn)}

/* ---- the agent look: everything an agent did or proposes wears this ---- */
.agentcard{border:1px solid var(--agent-line);background:linear-gradient(180deg,var(--agent-soft),var(--card) 70%);border-radius:var(--r);padding:16px;position:relative}
.agentcard .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--agent-ink)}
.agentcard .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--agent)}
.agentcard h4{font-size:14.5px;margin:6px 0 4px;font-family:var(--b);font-weight:700}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 10px 30px;font-size:13px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--card);border:1px solid var(--agent-line);color:var(--agent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.steps li::after{content:"";position:absolute;left:9.5px;top:22px;bottom:2px;width:1px;background:var(--agent-line)}
.steps li:last-child::after{display:none}
.steps b{display:block;font-weight:600}
.steps span{color:var(--muted)}
.draft{background:var(--card);color:var(--ink);border:1px dashed var(--agent-line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:13px;margin-top:10px}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.conf .bar{width:60px}
.honest{font-size:13px;color:var(--dim);margin-top:8px}
.qrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow:hover{background:var(--sunk)}
.qrow .ic{width:36px;height:36px;border-radius:10px;background:var(--agent);color:#fff;display:grid;place-items:center;font-size:16px}
.qrow h4{font-size:15px;font-family:var(--b);font-weight:600}
.qrow p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* ---- products ---- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.pcard .img{height:120px;display:grid;place-items:center;color:#fff;font-family:var(--d);font-size:30px;position:relative}
.pcard .img .tags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.pcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .v{font-size:13px;color:var(--muted)}
.pcard b{font-size:14px;line-height:1.3}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.pcard .price{font-family:var(--d);font-weight:600}
.pcard.on{outline:2px solid var(--accent);outline-offset:-2px}
.disc{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.facets{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.facets h5{margin:16px 0 6px;font-size:13px;color:var(--muted)}
.facets h5:first-child{margin-top:0}
.facets .chk em{font-style:normal;color:var(--dim);font-size:13px;margin-left:auto}
.briefbar{display:flex;gap:8px;margin-bottom:12px}
.briefbar input{font-size:15px;padding:12px 14px}
.notice{border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.agent{background:var(--agent-soft);color:var(--agent-ink)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.timeline li.done::before{background:var(--ok)}
.timeline li.todo::before{background:var(--line2)}
.timeline small{color:var(--muted);display:block;font-size:13px}
.stagebar{display:flex;gap:4px;margin:6px 0 16px;overflow-x:auto}
.stagebar button{flex:1;min-width:92px;border:1px solid var(--line2);background:var(--card);padding:9px 6px;min-height:40px;font-size:13px;font-weight:600;border-radius:8px;color:var(--muted)}
.stagebar button.done{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.stagebar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{accent-color:var(--brand);width:16px;height:16px}
.swatch{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);padding:0;cursor:pointer}

/* ---- overlays ---- */
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(640px,94vw);box-shadow:var(--shadow-lg);max-height:90vh;background:var(--card);color:var(--ink)}
dialog.wide{width:min(980px,96vw)}
dialog::backdrop{background:rgba(22,20,31,.45)}
.mhead{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--card);z-index:1}
.mhead h3{font-size:17px}
.mhead p{margin:3px 0 0;color:var(--muted);font-size:14px}
.mbody{padding:18px 22px 22px}
.x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:50%;font-size:16px;flex:none}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16141F;color:#fff;padding:10px 10px 10px 18px;border-radius:12px;font-size:14.5px;z-index:100;box-shadow:var(--shadow-lg);max-width:min(560px,92vw);display:flex;align-items:center;gap:14px;animation:toastIn .2s var(--ease)}
#toast .undo{border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:600;border-radius:8px;padding:8px 14px;min-height:36px}
#toast .undo:hover{background:rgba(255,255,255,.24)}
#toast:not(:has(.undo)){padding-right:18px}
#toast.bad{background:#B3261E}
#toast.agent{background:var(--agent)}
.stories{display:grid;gap:10px}
.story{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.story:hover{border-color:var(--brand);background:var(--brand-soft)}
.story .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.story b{display:block}
.story span{color:var(--muted);font-size:13.5px}


/* ---- 2026-10-06 human-first layer: My Day, more menu, search, steps, motion ---- */
.side .pri{font-size:15.5px}
.side .morebtn{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:44px;border:0;background:none;border-radius:var(--r-sm);color:var(--muted);font-weight:600;width:100%;text-align:left;margin-top:10px;border-top:1px solid var(--line);border-radius:0;padding-top:16px}
.side .morebtn:hover{color:var(--ink)}
.side .morebtn i{font-style:normal;width:20px;height:20px;display:grid;place-items:center}
.side .morebtn i svg{width:18px;height:18px;transition:transform .2s var(--ease)}
.side .morebtn[aria-expanded=true] i svg{transform:rotate(180deg)}
.side .moreg a{font-size:14.5px;padding:9px 12px;min-height:40px}
.top .gsearch{position:relative;flex:1 1 auto;max-width:520px;min-width:0}
.top .spacer{display:none}
#topacts{margin-left:auto}
.top .gsearch input{padding-left:40px;background:var(--sunk);border-color:transparent;border-radius:99px}
.top .gsearch input:focus{background:var(--card)}
.top .gsearch .gi{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.top .gsearch .gi svg{width:18px;height:18px}
#gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:min(70vh,520px);overflow:auto;z-index:50}
#gres .gh{font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 16px 4px}
#gres a{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;min-height:44px;align-items:center}
#gres a:hover,#gres a:focus{background:var(--sunk);outline:none}
#gres a small{color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--card);width:44px;height:44px;border-radius:99px;display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:19px;height:19px}
.burger svg{width:22px;height:22px}
/* My Day */
.myday .hello{font-size:30px;font-weight:650;letter-spacing:-.025em}
.myday .hello em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.08em;letter-spacing:-.03em;color:var(--muted)}
.myday .lead{font-size:17px;color:var(--ink2);margin:6px 0 0}
.progress{display:flex;align-items:center;gap:12px;margin:18px 0 22px;font-size:14px;color:var(--muted)}
.progress .track{flex:1;max-width:320px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s var(--ease)}
.todo .item .verb{flex:none}
.todo .kind{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:1px}
.todo .item.k-ok .kind{color:var(--agent-ink)}
.todo .item.k-late .kind{color:var(--bad)}
.allclear{padding:36px 24px;text-align:center}
.allclear b{display:block;font-size:20px;margin-bottom:6px}
/* the sentence at the top of a record */
.ph .sentence,.sentence{color:var(--ink);font-size:20px;line-height:1.35;font-weight:600;letter-spacing:-.015em;margin:2px 0 0;max-width:62ch}
.sentence .soft{color:var(--muted);font-weight:500}
.stepline{display:flex;align-items:center;gap:12px;margin:14px 0 4px;font-size:14px;color:var(--muted)}
.stepline .track{flex:1;max-width:360px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.stepline .track i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .6s var(--ease)}
.stepline b{color:var(--ink)}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.checklist li:last-child{border-bottom:0}
.checklist .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.checklist li.done .tick{background:var(--ok);border-color:var(--ok);color:var(--card)}
.checklist li.on .tick{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.checklist li .grow{flex:1;min-width:0}
.checklist li small{display:block;color:var(--muted);font-size:13px}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px}
.chat .msg{max-width:78%;background:var(--sunk);border-radius:14px 14px 14px 4px;padding:10px 14px}
.chat .msg.me{align-self:flex-end;background:var(--brand-soft);border-radius:14px 14px 4px 14px}
.chat .msg.todo{border:1px dashed var(--line2);background:transparent}
.chat .msg small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.srcpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.srcpick label{cursor:pointer}
.srcpick input{position:absolute;opacity:0;pointer-events:none}
.srcpick span{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:99px;padding:9px 16px;min-height:44px;font-weight:500}
.srcpick input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.srcpick input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
/* motion: short, and only on a real route change */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#shell.enter{animation:viewIn .16s var(--ease)}
#shell.enter .item,#shell.enter .kpi,#shell.enter .deal{animation:rowIn .32s var(--ease) both}
#shell.enter .item:nth-child(2),#shell.enter .kpi:nth-child(2),#shell.enter .deal:nth-child(2){animation-delay:.03s}
#shell.enter .item:nth-child(3),#shell.enter .kpi:nth-child(3),#shell.enter .deal:nth-child(3){animation-delay:.06s}
#shell.enter .item:nth-child(4),#shell.enter .kpi:nth-child(4),#shell.enter .deal:nth-child(4){animation-delay:.09s}
#shell.enter .item:nth-child(5),#shell.enter .deal:nth-child(5){animation-delay:.12s}
#shell.enter .item:nth-child(6),#shell.enter .deal:nth-child(6){animation-delay:.15s}
#shell.enter .item:nth-child(7),#shell.enter .deal:nth-child(7){animation-delay:.18s}
#shell.enter .item:nth-child(n+8),#shell.enter .deal:nth-child(n+8){animation-delay:.21s}
.confetti{position:fixed;left:50%;top:40%;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:120;animation:pop .6s var(--ease) forwards}
.kpi{transition:border-color .16s var(--ease),transform .16s var(--ease)}
.kpi[data-go]:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- print: the proposal PDF is this page printed ---- */
.printdoc{display:none}
@media print{
  body{background:#fff}
  #app,#login,#toast,dialog{display:none!important}
  .printdoc{display:block!important;font:12px/1.5 var(--b);color:#111;padding:0}
  .printdoc h1{font-size:22px}
  .printdoc table{width:100%;border-collapse:collapse;margin-top:14px}
  .printdoc th,.printdoc td{border-bottom:1px solid #ddd;padding:7px 6px;text-align:left}
  .printdoc .r{text-align:right}
  @page{margin:16mm}
}

/* ---- phones ---- */
.tabbar{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:flex;position:fixed;inset:0 30% 0 0;z-index:60;box-shadow:var(--shadow-lg)}
  .top{padding:0 14px}
  .top .hideph{display:none}
  .wrap{padding:16px 14px 96px}
  .stickyhead{position:static;box-shadow:none}
  .stickyhead .ph{position:sticky;top:60px;padding:8px 0}
  .split,.disc{grid-template-columns:1fr}
  .facets{position:static;max-height:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px;padding:6px 8px;min-height:48px;min-width:56px;font-weight:600}
  .tabbar a.on{color:var(--brand-ink)}
  .tabbar i{font-style:normal;width:22px;height:22px;display:grid;place-items:center}
  .tabbar i svg{width:22px;height:22px;stroke-width:1.75}
  .kv{grid-template-columns:110px 1fr}
  .item{flex-wrap:wrap}
  .item .grow{flex:1 1 calc(100% - 24px)}
  .board{grid-auto-columns:minmax(230px,82vw)}
  .ph h1{font-size:22px}
  .stickyhead .ph{flex-wrap:wrap}
  .stickyhead .ph .acts{max-width:none;justify-content:flex-start;flex:1 1 100%}
  .split>*,.grid2>*{min-width:0}
  .grid2,.grid3{grid-template-columns:1fr}
  .tbl{display:block;overflow-x:auto}
  .card .hd{flex-wrap:wrap}
  .uchip{padding:4px}
  .uchip>span{display:none}
  .stepline{flex-wrap:wrap;gap:8px}
  .stepline .track{display:none}
  .sentence{font-size:18px}
  .myday .hello{font-size:26px}
  .top{gap:8px}
  .top .gsearch input::placeholder{color:transparent}
  #gres{position:fixed;left:8px;right:8px;top:64px}
  .chat .msg{max-width:92%}
}

function load(){var d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(!d||!d.id){d={id:'pq-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10)),step:0,a:{},submitted:false}}
 return d}

function val(q){var a=S.a[q.id];
 if(q.type==='t'||q.type==='biz')return (a||'').trim();
 if(!a)return '';var v=(a.v||[]).join('; '),n=(a.n||'').trim();
 return v&&n?v+' | Note: '+n:(v||(n?'Note: '+n:''))}

 G.forEach(function(g){g.qs.forEach(function(q){if(q.type!=='you')out.push([header(q),val(q)])})});
 return out}

 G.forEach(function(g){g.qs.forEach(function(q){if(q.type!=='you')r.push([g.k+' '+g.name,q.id+' '+(q.q||q.h),val(q)])})});return r}

 });

}

function micFor(ta,box){if(!SR)return;

 b.setAttribute('aria-label','Speak your answer');b.innerHTML=MIC+'<span>Speak</span>';box.appendChild(b);

  rec.onerror=function(e){var m=box.querySelector('.micmsg')||box.appendChild(Object.assign(document.createElement('div'),{className:'micmsg'}));
   m.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'The microphone is blocked. Allow it in the browser, or type your answer.':'Could not hear that. Try again, or type.'};
  rec.onend=function(){b.setAttribute('aria-pressed','false');b.lastChild.textContent='Speak';if(live&&live.rec===rec)live=null;ta.focus()};
  try{rec.start()}catch(e){rec.onend()}
 }}
function stopMic(){if(live)live.rec.stop()}

/* ---------- render ---------- */
var app=document.getElementById('app'),back=document.getElementById('back'),next=document.getElementById('next');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hl(s){return esc(s).replace(/\*(.+?)\*/g,'<span class="gw">$1</span>')}
function textBox(id,label,small){
 var box=document.createElement('div');box.className='box';
 var ta=document.createElement('textarea');ta.id='f-'+id;if(small)ta.className='sm';ta.value=S.a[id]||'';
 if(label)ta.setAttribute('aria-label',label);
 ta.placeholder=SR?'Type, or press Speak and talk. Check the words before you continue.':'Type your answer.';
 ta.oninput=function(){S.a[id]=ta.value;keep()};box.appendChild(ta);micFor(ta,box);return box}
function choice(q){
 var wrap=document.createElement('div'),a=S.a[q.id]||(S.a[q.id]={v:[],n:''});
 if(q.type==='claim'){wrap.className='claim'+(a.v.length||a.n?' has':'')}
 var opts=q.type==='claim'?CLAIM:q.opts,multi=q.type==='many';
 var fs=document.createElement('div');fs.className='opts';fs.setAttribute('role',multi?'group':'radiogroup');fs.setAttribute('aria-labelledby','h-'+q.id);
 opts.forEach(function(o){var l=document.createElement('label');l.className='opt';
  var i=document.createElement('input');i.type=multi?'checkbox':'radio';i.name='o-'+q.id;i.value=o;i.checked=a.v.indexOf(o)>-1;
  i.onchange=function(){if(multi){a.v=[].slice.call(fs.querySelectorAll('input:checked')).map(function(x){return x.value})}else a.v=[o];if(q.type==='claim')wrap.classList.add('has');keep()};
  if(!multi){i.onclick=function(){if(a.v[0]===o&&i.dataset.was==='1'){i.checked=false;a.v=[];keep()}i.dataset.was=i.checked?'1':''};i.dataset.was=i.checked?'1':''}
  l.appendChild(i);l.appendChild(document.createTextNode(o));fs.appendChild(l)});
 wrap.appendChild(fs);
 var nb=textBox(q.id+'__n',(q.note||'Note')+' for '+q.id,true),ta=nb.querySelector('textarea');
 ta.value=a.n||'';ta.placeholder=(q.type==='claim'?'Correct figure or note':q.note||'Note')+(SR?' (type or Speak)':'');
 ta.oninput=function(){a.n=ta.value;keep()};wrap.appendChild(nb);return wrap}
function render(){
 stopMic();window.scrollTo(0,0);app.innerHTML='';
 var n=G.length;document.getElementById('barFill').style.width=(Math.min(S.step,n)/n*100)+'%';
 back.disabled=S.step===0;back.hidden=S.step>REVIEW;next.hidden=S.step>REVIEW;
 if(S.step>REVIEW)return renderDone();
 if(S.step===REVIEW)return renderReview();
 var g=G[S.step];
 next.textContent=S.step===n-1?'Review answers':'Continue';
 var h=document.createElement('div');
 h.innerHTML='<div class="strip mono"><span>Step '+(S.step+1)+' of '+n+'</span><span>Group '+g.k+'</span></div>'+
  '<h1 class="hl">'+hl(g.head)+'</h1>'+'<p class="mono" style="margin:0 0 8px">'+g.k+' / '+esc(g.name)+(g.pro?' <span class="pro">Pro only</span>':'')+'</p>'+
  (g.lede?'<p class="lede">'+esc(g.lede)+'</p>':'')+(S.step===0?'<p class="lede" style="margin-top:-12px">Nine short steps. Everything saves when you press Continue, and you can come back on this device and carry on. You can also download your answers at any time.</p>':'');
 app.appendChild(h);
 g.qs.forEach(function(q){
  if(q.type==='you'){var y=document.createElement('div');y.className='you';
   y.innerHTML='<p class="mono" style="margin:0 0 12px">You, the person filling this in</p><div class="two"></div>';
   var two=y.querySelector('.two');
   YOU.forEach(function(f){var d=document.createElement('div');d.className='field';
    d.innerHTML='<label for="f-'+f[0]+'">'+f[1]+'</label><input type="'+f[2]+'" id="f-'+f[0]+'" autocomplete="'+f[3]+'"'+(f[2]==='tel'?' inputmode="tel"':'')+'>';
    var i=d.querySelector('input');i.value=S.a[f[0]]||'';i.oninput=function(){S.a[f[0]]=i.value;keep()};two.appendChild(d)});
   app.appendChild(y);return}
  if(q.type==='biz'){var d=document.createElement('details');d.className='biz';
   d.innerHTML='<summary><span id="h-'+q.id+'">'+esc(q.h)+'</span>'+((S.a[q.id]||'').trim()?'<span class="done">Answered</span>':'')+'</summary><div class="in"><p class="hint">'+esc(q.hint)+'</p></div>';
   d.querySelector('.in').appendChild(textBox(q.id,q.h));app.appendChild(d);return}
  var s=document.createElement('section');s.className='q';
  s.innerHTML='<p class="qh"><b>'+q.id+'</b><span id="h-'+q.id+'">'+esc(q.q||q.h)+'</span></p>'+(q.hint?'<p class="hint">'+esc(q.hint)+'</p>':'');
  if(q.type==='t'){var tb=textBox(q.id);tb.querySelector('textarea').setAttribute('aria-labelledby','h-'+q.id);s.appendChild(tb)}
  else s.appendChild(choice(q));
  app.appendChild(s)});
}
function renderReview(){
 next.textContent='Submit answers';
 var h='<div class="strip mono"><span>Review</span><span>'+S.id.slice(0,11)+'</span></div><h1 class="hl">Check, then <span class="gw">submit</span>.</h1><p class="lede">Press Back to change anything. After you submit you can still come back, change an answer and submit again; it updates the same record.</p><dl class="review">';
 var last='';rowsFor().forEach(function(r){if(r[0]!==last){h+='<h3>'+esc(r[0])+'</h3>';last=r[0]}h+='<dt>'+esc(r[1])+'</dt><dd>'+(r[2]?esc(r[2]):'<span class="mono">Not answered</span>')+'</dd>'});
 app.innerHTML=h+'</dl>'}
function renderDone(){
 document.getElementById('barFill').style.width='100%';
 app.innerHTML='<div class="strip mono"><span>Done</span><span>'+S.id.slice(0,11)+'</span></div><h1 class="hl">Thank you. Your answers are <span class="gw">in</span>.</h1>'+
 '<div class="done-box"><p class="lede" id="doneMsg" style="margin:0">'+(S.serverSubmitted?'ZippyScale has your answers. Bhargav Naidu will come back to you with the next step.':'Your answers are saved on this device. Please press Download my answers and email the file to bhargav@zippyscale.com, so nothing is missed.')+'</p>'+
 '<div class="btns"><button type="button" class="btn" id="dlCsv">Download my answers (Excel)</button><button type="button" class="btn gh" id="dlPdf">Print or save as PDF</button><button type="button" class="btn gh" id="edit">Change an answer</button></div></div>';
 document.getElementById('dlCsv').onclick=csv;document.getElementById('dlPdf').onclick=printView;
 document.getElementById('edit').onclick=function(){S.step=0;keep();render()};
 setStatus(S.serverSubmitted?'Submitted to ZippyScale':'Saved on this device',S.serverSubmitted)}

/* ---------- navigation ---------- */
next.onclick=function(){
 if(S.step<REVIEW){S.step++;keep();render();post(true).then(saved);setStatus('Saving');return}
 next.disabled=true;setStatus('Submitting');S.submitted=true;keep();
 post(false).then(function(ok){S.serverSubmitted=ok;S.step=REVIEW+1;keep();next.disabled=false;render()})};
back.onclick=function(){if(S.step>0){S.step--;keep();render()}};

/* ---------- downloads ---------- */
function csv(){
 var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
 var lines=[['Prathima Group answers','Response ID '+S.id,new Date().toLocaleString('en-IN')].map(q).join(','),['Section','Question','Answer'].map(q).join(',')]
  .concat(rowsFor().map(function(r){return r.map(function(x){return q(/^[=+\-@]/.test(x)?"'"+x:x)}).join(',')}));
 var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='Prathima Group answers.csv';document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function printView(){
 var h='<h1>Prathima Group: answers for ZippyScale</h1><p class="mono">Response '+esc(S.id)+' / '+new Date().toLocaleString('en-IN')+'</p>',last='';
 rowsFor().forEach(function(r){if(r[0]!==last){h+=(last?'</dl>':'')+'<h2>'+esc(r[0])+'</h2><dl>';last=r[0]}h+='<dt>'+esc(r[1])+'</dt><dd>'+(r[2]?esc(r[2]):'Not answered')+'</dd>'});
 document.getElementById('print').innerHTML=h+'</dl>';window.print()}
document.getElementById('dlTop').onclick=function(){
 var m=document.getElementById('dlMenu');if(m){m.remove();return}
 m=document.createElement('div');m.id='dlMenu';m.style.cssText='position:fixed;top:64px;right:16px;z-index:60;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:8px;display:grid;gap:6px;box-shadow:0 10px 30px rgba(20,33,61,.12)';
 m.innerHTML='<button type="button" class="btn">Download my answers (Excel)</button><button type="button" class="btn gh">Print or save as PDF</button>';
 m.children[0].onclick=function(){m.remove();csv()};m.children[1].onclick=function(){m.remove();printView()};document.body.appendChild(m)};

render();
if(S.step>0&&S.step<=REVIEW)setStatus('Welcome back. Your answers are here',true);
})();
</script>
</body></html>
